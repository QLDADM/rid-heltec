; Sensor Remote ID dla Heltec WiFi LoRa 32 V3 (ESP32-S3)
; Wgranie: pio run -t upload   (z katalogu firmware)

[env:heltec_v3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 921600
; zapis dronów w pamięci flash, gdy płytka pracuje bez komputera
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@4.6.1
    jgromes/RadioLib@6.6.0
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CONFIG_BT_NIMBLE_EXT_ADV=1
    ; telefony drużyny sparowane z PIN-em (domyślnie tylko 3)
    -D CONFIG_BT_NIMBLE_MAX_BONDS=8

; Tylko Wi-Fi (bez BLE): radio nie dzieli czasu z Bluetooth
[env:heltec_v3_wifi]
extends = env:heltec_v3
build_flags =
    ${env:heltec_v3.build_flags}
    -D RID_NO_BLE=1
